# Recipients per client. Matching is case- and accent-insensitive against the
# COMPANY / PLANT field extracted from the PDF, and longer patterns win.
#
# A client listed here gets its draft created with `to` already filled, so the
# technician only reviews it. A company that matches nothing here still gets a
# draft with an empty To field, as before.
#
# Addresses in `to` are pre-loaded, not sent: the program only ever creates
# drafts. The shared copies live in `always_cc` below; a client's own `cc` is
# added on top of them.

clients:
  - match: ["prolesur"]
    display_name: "Prolesur"
    to: ["guillermo.lorcat@soprole.cl"]
    cc: []

  - match: ["vital jugos"]
    display_name: "Vital Jugos"
    to:
      - "rletelier@koandina.com"
      - "mvalenzuelal@koandina.com"
    cc: []

  - match: ["soprole"]
    display_name: "Soprole"
    to:
      - "hernan.vergara@soprole.cl"
      - "luis.olea@soprole.cl"
    # Only on Soprole drafts, on top of always_cc.
    cc: ["cvarela@emeltec.cl"]

  - match: ["surlat"]
    display_name: "Surlat"
    to:
      - "fmatamala@quillayessurlat.cl"
      - "hcortes@quillayessurlat.cl"
      - "jtorres@quillayessurlat.cl"
      - "edonoso@quillayessurlat.cl"
    cc: []

# Always copied when the report urgency matches settings.yaml -> urgency.critical_values
critical_cc: []

# Copied on every draft, regardless of client. Useful for an internal archive mailbox.
always_cc:
  - "porellana@emeltec.cl"
  - "cfarias@emeltec.cl"
  - "mlizana@emeltec.cl"
  - "hlagos@emeltec.cl"
